[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emodna"
version = "1.0.0"
description = "EMODNA for cross-corpus speech emotion recognition"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "librosa>=0.10",
  "soundfile>=0.12",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "tqdm>=4.66",
]

[tool.setuptools.packages.find]
include = ["emodna*", "tools*"]
